<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juice Shop Style Login Demo</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { align-items: center; background: #1f1f1f; display: flex; justify-content: center; margin: 0; min-height: 100vh; }
      main { background: #303030; border-radius: 8px; box-shadow: 0 8px 24px #0008; max-width: 420px; padding: 32px; width: calc(100% - 32px); }
      h1 { color: #f9a825; font-size: 1.65rem; margin: 0 0 8px; }
      p { color: #ddd; line-height: 1.5; margin: 0 0 24px; }
      label { display: block; font-weight: bold; margin: 16px 0 6px; }
      input { background: #fff; border: 2px solid transparent; border-radius: 4px; color: #222; font-size: 1rem; padding: 11px; width: 100%; }
      input:focus { border-color: #f9a825; outline: none; }
      button { background: #f9a825; border: 0; border-radius: 4px; color: #222; cursor: pointer; font-size: 1rem; font-weight: bold; margin-top: 24px; padding: 12px; width: 100%; }
      button:hover { background: #ffca28; }
      #form-message { min-height: 24px; margin-top: 16px; }
      .error { color: #ff8a80; }
      .success { color: #b9f6ca; }
    </style>
  </head>
  <body>
    <main>
      <h1>Welcome back</h1>
      <p>Sign in to the Juice Shop demo.</p>

      <form id="login-form" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <button type="submit">Log in</button>
        <p id="form-message" aria-live="polite"></p>
      </form>
    </main>
    <script src="app.js"></script>
  </body>
</html>
